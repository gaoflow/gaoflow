name: Update merged PR card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gaoflow-merged-pr-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Query GitHub and render the SVG
        id: render
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: gaoflow
        run: |
          count=$(python3 scripts/update_merged_pr_card.py)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Verify the change scope
        id: changes
        run: |
          if ! git diff --quiet -- . ':(exclude)assets/merged-prs.svg'; then
            echo "Unexpected tracked files changed" >&2
            git status --short >&2
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Unexpected untracked files created" >&2
            git status --short >&2
            exit 1
          fi

          if git diff --quiet -- assets/merged-prs.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the refreshed card
        if: steps.changes.outputs.changed == 'true'
        env:
          COUNT: ${{ steps.render.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/merged-prs.svg
          git commit -m "chore(profile): update merged PR count to ${COUNT} [skip ci]"
          git push origin HEAD:main
